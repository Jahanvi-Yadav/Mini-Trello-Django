services:
  - type: web
    name: mini-trello-django
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn minitrello.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: mini-trello-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: mini-trello-db
    databaseName: minitrello
    user: minitrello
